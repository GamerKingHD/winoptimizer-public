[package]
name = "winoptimizer"
version = "1.0.0"
edition = "2021"
rust-version = "1.94"
description = "Windows system optimization utility: disk cleanup, registry, startup, tweaks, and analysis"

[lib]
name = "winoptimizer_lib"
crate-type = ["lib", "cdylib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["custom-protocol", "protocol-asset"] }
tauri-plugin-shell = "2"
tauri-plugin-dialog = "2"
tauri-plugin-process = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
windows = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Storage_FileSystem",
    "Win32_System_Registry",
    "Win32_System_Com",
    "Win32_System_Com_StructuredStorage",
    "Win32_System_Ole",
    "Win32_System_TaskScheduler",
    "Win32_System_Variant",
    "Win32_System_Threading",
    "Win32_System_LibraryLoader",
    "Win32_System_SystemInformation",
    "Win32_System_Services",
    "Win32_System_Power",
    "Win32_NetworkManagement_IpHelper",
    "Win32_NetworkManagement_Ndis",
    "Win32_Networking_WinHttp",
    "Win32_Networking_WinSock",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_Security_Cryptography",
    "Win32_System_IO",
    "Win32_System_Ioctl",
    "Win32_System_JobObjects",
    "Win32_System_Pipes",
    "Win32_System_RemoteDesktop",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }
rusqlite = { version = "0.32", features = ["bundled"] }
chrono = "0.4"
blake3 = "1.5"
ed25519-dalek = "2"
memmap2 = "0.9"
uuid = { version = "1", features = ["v4"] }
walkdir = "2"
jwalk = "0.8"
regex = "1"
sysinfo = "0.33"
thiserror = "2"
log = "0.4"
env_logger = "0.11"
rayon = "1.10"
tokio = { version = "1", features = ["time"] }

[target.'cfg(target_os = "windows")'.dependencies]
windows-result = "0.3"

[target.'cfg(target_arch = "aarch64")'.dependencies]
blake3 = { version = "1.5", features = ["no_neon"] }

[dev-dependencies]
# blake3 and sha2 are already in the dependency tree of both editions.
blake3 = { version = "1.5", features = ["rayon"] }
mockall = "0.13"
sha2 = "0.10"
tempfile = "3"
